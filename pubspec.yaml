name: tamper_guard
description: Android accessibility service that closes matching windows natively the instant they appear, streams window and view-text changes, plus a device admin with a deactivation warning.
version: 0.3.0
homepage: https://github.com/1AdityaX/flutter_plugin_tamper_guard

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.aditya.tamper_guard
        pluginClass: TamperGuardPlugin
